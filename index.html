<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5;url=https://wirre.vercel.app/">
    <title>Site Migrated - Wirre</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            background: #fff;
            padding: 80px 60px;
            border: 3px solid #000;
            text-align: center;
            max-width: 700px;
            width: 100%;
            animation: slideIn 0.6s ease-out;
            box-shadow: 12px 12px 0 rgba(0, 0, 0, 0.1);
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 72px;
            margin-bottom: 30px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        h1 {
            color: #000;
            font-size: 48px;
            margin-bottom: 20px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        p {
            color: #333;
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .new-url {
            background: #000;
            color: #fff;
            padding: 20px 40px;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 40px;
            display: inline-block;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 3px solid #000;
        }

        .new-url:hover {
            background: #fff;
            color: #000;
            transform: translate(-4px, -4px);
            box-shadow: 8px 8px 0 #000;
        }

        .redirect-message {
            color: #666;
            font-size: 16px;
            margin-top: 30px;
            font-weight: 500;
        }

        .loader {
            width: 100%;
            max-width: 300px;
            height: 6px;
            background: #e0e0e0;
            margin: 30px auto;
            overflow: hidden;
            border: 2px solid #000;
        }

        .loader-bar {
            height: 100%;
            background: #000;
            animation: loading 5s linear forwards;
        }

        @keyframes loading {
            from {
                width: 0%;
            }
            to {
                width: 100%;
            }
        }

        .manual-link {
            margin-top: 30px;
        }

        .manual-link a {
            color: #000;
            text-decoration: none;
            font-weight: 700;
            border-bottom: 3px solid #000;
            padding-bottom: 2px;
            transition: all 0.2s;
        }

        .manual-link a:hover {
            background: #000;
            color: #fff;
            padding: 4px 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚀</div>
        <h1>Website Migrated</h1>
        <p>This website has been migrated to a new location.</p>
        
        <a href="https://wirre.vercel.app/" class="new-url">wirre.vercel.app</a>
        
        <div class="loader">
            <div class="loader-bar"></div>
        </div>
        
        <p class="redirect-message">You will be automatically redirected in 5 seconds...</p>
        
        <div class="manual-link">
            <a href="https://wirre.vercel.app/">Click here if you are not redirected</a>
        </div>
    </div>

    <script>
        // Prevent navigation away from the page
        let redirected = false;
        
        // Auto redirect after 5 seconds
        setTimeout(() => {
            redirected = true;
            window.location.href = 'https://wirre.vercel.app/';
        }, 5000);

        // Prevent back button (optional - can be removed if too aggressive)
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            if (!redirected) {
                history.go(1);
            }
        };
    </script>
</body>
</html>
