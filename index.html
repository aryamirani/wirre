<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5;url=https://wirre.vercel.app/">
    <title>Site Migrated - Wirre</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .container {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 600px;
            width: 100%;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon {
            font-size: 64px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        h1 {
            color: #333;
            font-size: 32px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        p {
            color: #666;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .new-url {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 30px;
            display: inline-block;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .new-url:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .redirect-message {
            color: #999;
            font-size: 14px;
            margin-top: 20px;
        }

        .loader {
            width: 200px;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            margin: 20px auto;
            overflow: hidden;
        }

        .loader-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
            animation: loading 5s linear forwards;
        }

        @keyframes loading {
            from {
                width: 0%;
            }
            to {
                width: 100%;
            }
        }

        .manual-link {
            margin-top: 20px;
        }

        .manual-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .manual-link a:hover {
            border-bottom-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚀</div>
        <h1>Website Migrated</h1>
        <p>This website has been migrated to a new location.</p>
        
        <a href="https://wirre.vercel.app/" class="new-url">wirre.vercel.app</a>
        
        <div class="loader">
            <div class="loader-bar"></div>
        </div>
        
        <p class="redirect-message">You will be automatically redirected in 5 seconds...</p>
        
        <div class="manual-link">
            <a href="https://wirre.vercel.app/">Click here if you are not redirected</a>
        </div>
    </div>

    <script>
        // Prevent navigation away from the page
        let redirected = false;
        
        // Auto redirect after 5 seconds
        setTimeout(() => {
            redirected = true;
            window.location.href = 'https://wirre.vercel.app/';
        }, 5000);

        // Prevent back button (optional - can be removed if too aggressive)
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            if (!redirected) {
                history.go(1);
            }
        };
    </script>
</body>
</html>
